name: Bug report
description: Report a reproducible problem in GptGate RTL
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: GptGate RTL version
    validations:
      required: true
  - type: input
    id: chatgpt-version
    attributes:
      label: ChatGPT Desktop version
    validations:
      required: true
  - type: dropdown
    id: install-type
    attributes:
      label: ChatGPT installation
      options: [Microsoft Store, Regular desktop installation]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Do not include chat contents, credentials, or profile files.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
