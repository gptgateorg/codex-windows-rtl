name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and check
        run: |
          dotnet build .\CodexRtlManager\CodexRtlManager.csproj -c Release
          dotnet run --project .\CodexRtlManager.Tests\CodexRtlManager.Tests.csproj -c Release
      - name: Publish both editions
        run: |
          dotnet publish .\CodexRtlManager\CodexRtlManager.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o .\artifacts\light
          dotnet publish .\CodexRtlManager\CodexRtlManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o .\artifacts\standalone
          Compress-Archive -Path .\artifacts\light\GptGateRTL.exe,README.md,LICENSE,THIRD_PARTY_NOTICES.md,.\CodexRtlManager\Resources\Arad-OFL.txt -DestinationPath .\artifacts\GptGate-RTL-light-win-x64.zip
          Compress-Archive -Path .\artifacts\standalone\GptGateRTL.exe,README.md,LICENSE,THIRD_PARTY_NOTICES.md,.\CodexRtlManager\Resources\Arad-OFL.txt -DestinationPath .\artifacts\GptGate-RTL-standalone-win-x64.zip
          Get-FileHash .\artifacts\GptGate-RTL-*-win-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content .\artifacts\SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/GptGate-RTL-light-win-x64.zip
            artifacts/GptGate-RTL-standalone-win-x64.zip
            artifacts/SHA256SUMS.txt
