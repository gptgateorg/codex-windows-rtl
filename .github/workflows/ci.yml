name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build .\CodexRtlManager\CodexRtlManager.csproj -c Release
      - name: Checks
        run: dotnet run --project .\CodexRtlManager.Tests\CodexRtlManager.Tests.csproj -c Release
      - name: Publish lightweight build
        run: dotnet publish .\CodexRtlManager\CodexRtlManager.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o .\artifacts\light
      - uses: actions/upload-artifact@v4
        with:
          name: GptGate-RTL-light
          path: artifacts/light/GptGateRTL.exe
